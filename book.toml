[book]
title = "PersonalTest"
authors = ["ZxLili"]
language = "fr"

# apparence
[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
# plugin admonish faire mdbook-admonish install /DocFlow
additional-css = ["./mdbook-admonish.css"]
additional-js = ["mermaid.min.js", "mermaid-init.js"]


# pour avoir le toc
[preprocessor.toc]
command = "mdbook-toc"
renderer = ["html"]
marker = "{{#toc}}"
depth = 3

#mermaid
[preprocessor.mermaid]
command = "mdbook-mermaid"




