name: Deploy mdBook site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: 0.4.47
    steps:
      - uses: actions/checkout@v4

      - name: Download prebuilt binaries (Instant)
        run: |
          mkdir -p ~/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH

          # Téléchargement instantané de mdBook (pas de compilation)
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C ~/.local/bin

          # Téléchargement instantané de mdbook-mermaid (pas de compilation)
          MERMAID_VERSION=$(curl -sSL https://api.github.com/repos/badboy/mdbook-mermaid/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          curl -sSL "https://github.com/badboy/mdbook-mermaid/releases/download/${MERMAID_VERSION}/mdbook-mermaid-${MERMAID_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C ~/.local/bin

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with mdBook
        run: mdbook build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4